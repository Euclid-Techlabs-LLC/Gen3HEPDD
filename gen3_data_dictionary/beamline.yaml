$schema: http://json-schema.org/draft-04/schema#
id: beamline
title: beamline
type: object
namespace: http://192.168.0.230/
category: experimental_methods
program: '*'
project: '*'
description: ''
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: runs
  backref: beamlines
  label: part_of
  target_type: run
  multiplicity: one_to_many
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_name:
    type: string
    description: the name of the node in the database
  run_name:
    type: string
    description: name of the run
  data_submitter_id:
    type: string
    description: a human-readable unique identifer for a record in the metadata database
  beamline_name:
    type: string
    description: name of the beamline
  particle:
    type: string
    description: particles accelerated by this beamline
  laboratory:
    type: string
    description: the laboratory where the beamline is located
  runs:
    $ref: _definitions.yaml#/to_many
additionalProperties: false
