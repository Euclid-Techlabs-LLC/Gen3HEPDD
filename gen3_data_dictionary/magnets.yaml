$schema: http://json-schema.org/draft-04/schema#
id: magnets
title: magnets
type: object
namespace: http://192.168.0.230/
category: experimental_methods
program: '*'
project: '*'
description: the magnets used to guide the beam
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: beamlines
  backref: magnetss
  label: part_of
  target_type: beamline
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_name:
    type: string
    description: the name of the node in the database
  beamline_name:
    type: string
    description: name of the beamline
  data_submitter_id:
    type: string
    description: a human-readable unique identifer for a record in the metadata database
  magnet_name:
    type: string
    description: the name of the magnet
  magnet_type:
    type: string
    description: the type of magnet
  dimensions:
    type: array
    items:
      type: string
    description: the dimensions of the magnet
  location:
    type: array
    items:
      type: string
    description: the location of the magnets within the beamline coordinate system
  beamlines:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
