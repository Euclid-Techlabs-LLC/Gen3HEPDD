$schema: http://json-schema.org/draft-04/schema#
id: publication
title: publication
type: object
namespace: http://192.168.0.230/
category: administrative
program: '*'
project: '*'
description: ''
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: projects
  backref: publications
  label: part_of
  target_type: project
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_name:
    type: string
    description: the name of the node in the database
  project_name:
    type: string
    description: the project the data belongs to; the parent node
  data_submitter_id:
    type: string
    description: a human-readable unique identifer for a record in the metadata database
  article_name:
    type: string
    description: the name of the publication article
  journal_name:
    type: string
    description: journal published in
  date:
    type: number
    description: date of the publication
  author:
    type: array
    items:
      type: string
    description: list of authors
  issue:
    type: integer
    description: journal issue
  year:
    type: integer
    description: year published
  number:
    type: string
    description: issue number
  study_name:
    type: string
    description: name of the study
  data_source:
    type: string
    description: 'source of the data. options are: simulation or experiment'
  projects:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
