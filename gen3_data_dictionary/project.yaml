$schema: http://json-schema.org/draft-04/schema#
id: project
title: project
type: object
namespace: http://192.168.0.230/
category: administrative
program: '*'
project: '*'
description: the sub project within a given program
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: programs
  backref: projects
  label: part_of
  target_type: program
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  availability_type:
    type: string
    description: the hardcoded availability type
  dbgap_accession_number:
    type: string
    description: the db gap accession number
  code:
    type: string
    description: the unique id of the data used for linking
  programs:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
