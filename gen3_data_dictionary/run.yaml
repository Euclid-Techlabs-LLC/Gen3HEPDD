$schema: http://json-schema.org/draft-04/schema#
id: run
title: run
type: object
namespace: http://192.168.0.230/
category: administrative
program: '*'
project: '*'
description: ''
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: studys
  backref: runs
  label: part_of
  target_type: study
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_name:
    type: string
    description: the name of the node in the database
  study_name:
    type: string
    description: name of the study
  run_name:
    type: string
    description: name of the run
  date:
    type: number
    description: date of the run
  run_number:
    type: integer
    description: the run number
  studys:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
