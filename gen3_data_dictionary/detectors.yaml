$schema: http://json-schema.org/draft-04/schema#
id: detectors
title: detectors
type: object
namespace: http://192.168.0.230/
category: experimental_methods
program: '*'
project: '*'
description: the detectors and sensors on the beamline
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: beamlines
  backref: detectorss
  label: part_of
  target_type: beamline
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_name:
    type: string
    description: the name of the node in the database
  run_name:
    type: string
    description: the date the run belongs to; the parent node
  data_submitter_id:
    type: string
    description: a human-readable unique identifer for a record in the metadata database
  detector_type:
    type: string
    description: the type of detector
  dimensions:
    type: array
    items:
      type: string
    description: the dimensions of the active volume
  location:
    type: array
    items:
      type: string
    description: the location within the beamline coordinate system
  beamlines:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
