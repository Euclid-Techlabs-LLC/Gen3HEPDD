$schema: http://json-schema.org/draft-04/schema#
id: study
title: study
type: object
namespace: http://192.168.0.230/
category: administrative
program: '*'
project: '*'
description: the specific scientific study done within a project
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: projects
  backref: studys
  label: part_of
  target_type: project
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_name:
    type: string
    description: the name of the node in the database
  project_name:
    type: string
    description: the project the data belongs to; the parent node
  data_submitter_id:
    type: string
    description: a human-readable unique identifer for a record in the metadata database
  projects:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
