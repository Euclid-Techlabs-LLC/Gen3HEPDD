$schema: http://json-schema.org/draft-04/schema#
id: recon_file
title: recon_file
type: object
namespace: http://192.168.0.230/
category: data_file
program: '*'
project: '*'
description: ''
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- exclusive: false
  required: true
  subgroup:
  - name: magnetss
    backref: recon_files
    label: part_of
    target_type: magnets
    multiplicity: many_to_one
    required: true
  - name: cavitiess
    backref: recon_files
    label: part_of
    target_type: cavities
    multiplicity: many_to_one
    required: true
  - name: detectorss
    backref: recon_files
    label: part_of
    target_type: detectors
    multiplicity: many_to_one
    required: true
  - name: primary_beams
    backref: recon_files
    label: part_of
    target_type: primary_beam
    multiplicity: many_to_one
    required: true
  - name: core_metadata_collections
    backref: recon_files
    label: part_of
    target_type: core_metadata_collection
    multiplicity: one_to_one
    required: false
properties:
  $ref: _definitions.yaml#/data_file_properties
  node_name:
    type: string
    description: the name of the node in the database
  parent_name:
    type: string
    description: ' the node the data source belongs to; the parent node'
  data_submitter_id:
    type: string
    description: a human-readable unique identifer for a record in the metadata database
  file_name:
    type: string
    description: name of the data file
  format:
    type: string
    description: the format of the data file
  size:
    type: integer
    description: ' the size of the file in bytes'
  magnetss:
    $ref: _definitions.yaml#/to_one
  cavitiess:
    $ref: _definitions.yaml#/to_one
  detectorss:
    $ref: _definitions.yaml#/to_one
  primary_beams:
    $ref: _definitions.yaml#/to_one
  core_metadata_collections:
    $ref: _definitions.yaml#/to_one
  data_category:
    description: Broad categorization of the contents of the data file.
    enum:
    - data_category_1
    - data_category_2
    - data_category_3
  data_format:
    description: The format of the data in this data file
    enum:
    - data_format_1
    - data_format_2
    - data_format_3
  data_type:
    description: The type of data in this data file
    enum:
    - data_type_1
    - data_type_2
    - data_type_3
additionalProperties: false
