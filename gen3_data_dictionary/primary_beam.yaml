$schema: http://json-schema.org/draft-04/schema#
id: primary_beam
title: primary_beam
type: object
namespace: http://192.168.0.230/
category: experimental_methods
program: '*'
project: '*'
description: ''
submittable: true
validators: null
systemProperties:
- id
- project_id
- state
- created_datetime
- updated_datetime
uniqueKeys:
- - id
- - project_id
  - submitter_id
required:
- submitter_id
- type
links:
- name: beamlines
  backref: primary_beams
  label: part_of
  target_type: beamline
  multiplicity: many_to_one
  required: true
properties:
  $ref: _definitions.yaml#/ubiquitous_properties
  node_name:
    type: string
    description: the name of the node in the database
  run_name:
    type: string
    description: the date the run belongs to; the parent node
  data_submitter_id:
    type: string
    description: a human-readable unique identifer for a record in the metadata database
  beam_name:
    type: string
    description: name of the primary beam
  particle:
    type: integer
    description: PDGID particle number
  energy:
    type: number
    description: ' the beam energy'
  current:
    type: number
    description: the beam current
  beamlines:
    $ref: _definitions.yaml#/to_one
additionalProperties: false
